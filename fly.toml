# Fly.io config for the BrandFactory API (Hono + WS on Node).
#
# Operators: update `app` and `primary_region` before first `fly deploy`.
# Secrets (DATABASE_URL, SUPABASE_*, OPENROUTER_API_KEY, CORS_ALLOWED_ORIGINS)
# are set via `fly secrets set`, not in this file.

app            = "brandfactory"
primary_region = "sin"
kill_signal    = "SIGINT"

[build]
  dockerfile = "packages/server/Dockerfile"

# Migrations run before new machines start serving. The migrate script
# uses `drizzle-orm/migrator` directly (not drizzle-kit) so we don't have
# to ship dev tooling in the runtime image; `migrationsFolder: './drizzle'`
# resolves relative to cwd, hence the cd into the db package.
[deploy]
  release_command = "sh -c 'cd node_modules/@brandfactory/db && node scripts/migrate.mjs'"

[http_service]
  internal_port        = 3001
  force_https          = true
  # **Machine count and REALTIME_PROVIDER move together.**
  #
  # `native-ws` is in-process pub/sub and is correct on exactly one Machine.
  # `pg-backplane` carries the publish between Machines over Postgres and is
  # what 2+ requires. Scaling without setting it breaks realtime fan-out for
  # roughly half of sessions, silently — this app ran that way from May to
  # September and nobody noticed, because the only screen that subscribes had
  # no deployment.
  #
  #   fly secrets set REALTIME_PROVIDER=pg-backplane
  #
  # **The Machine count is also half of the connection budget**, and that half
  # was missed until production answered a 500 on 5 October 2026. Each Machine
  # holds its own `pg` Pool, so the app's total is `DATABASE_POOL_MAX` ×
  # Machines and it must stay under the Supabase pooler's `pool_size` (15).
  # At the default of 5 and two Machines that is 10, with headroom for
  # `migrate.mjs` during a deploy. Raising either number without checking the
  # other reaches `EMAXCONNSESSION`, which surfaces in `getUserById` — the
  # first read every authenticated request makes — so it reads as the whole
  # app being down. See `makePool` in `@brandfactory/db`.
  #
  # ⚠️ `DATABASE_URL` must be the **transaction-mode** pooler, port 6543. On
  # 5432 the pooler is session-mode, where a pooled client holds a server
  # connection for its whole life rather than for a statement, and the budget
  # above does not apply.
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

[[http_service.checks]]
  method       = "GET"
  path         = "/health"
  interval     = "15s"
  grace_period = "10s"

# Non-secret defaults. Provider/runtime selection; all secret material
# lives in `fly secrets`.
#
# RESEARCH_PROVIDER is deliberately unset here: it defaults to `none` in
# EnvSchema, so brand research ships dark (no rail row, no ticker, 501 on
# POST). To enable paid Perplexity runs in production:
#   fly secrets set PERPLEXITY_API_KEY=pplx-... RESEARCH_PROVIDER=perplexity
# Do not flip this on casually — each run is ~$0.40 and 3–15 minutes.
[env]
  HOST              = "0.0.0.0"
  PORT              = "3001"
  LOG_LEVEL         = "info"
  AUTH_PROVIDER     = "supabase"
  STORAGE_PROVIDER  = "supabase"
  REALTIME_PROVIDER = "native-ws"
  LLM_PROVIDER      = "openrouter"
  LLM_MODEL         = "anthropic/claude-sonnet-4.6"

# Default Fly Machines ship at 256 MiB; that's tight for Node + tsx JIT +
# pg Pool + ws. 512 MiB gives headroom without committing to dedicated CPU.
[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
