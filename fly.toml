# The core (packages/core) on the existing Fly app `brandfactory` (region sin), which the archived
# BrandFactory server used. The owner chose this app for the core on 18 Oct 2026
# (docs/completions/packs-core-plan.md, open decision 3); deploying replaces that server, and the
# owner decides when.
#
# Secrets, set with `fly secrets set` (never in this file):
#   DATABASE_URL           the Fly Postgres app `brandbase-db` (sin), over Fly's private network,
#                          as a login role that is not a superuser: a member of pack_runtime,
#                          pack_admin and pack_migrator that owns the packs schema and nothing
#                          else (docs/completions/packs-core-phases-1-to-8.md, phase 3 review).
#                          Not Supabase or Fly Managed Postgres: neither gives the superuser the
#                          first install needs (src/migrate.ts).
#   SUPABASE_JWKS_URL      Passport's project: https://<project>.supabase.co/auth/v1/.well-known/jwks.json
#   SUPABASE_JWT_ISSUER    Passport's project: https://<project>.supabase.co/auth/v1
#   SUPABASE_URL, SUPABASE_SERVICE_KEY   for Storage
#   FILES_BUCKET           a private bucket
#   FILES_SECRET           openssl rand -base64 32
#   AGENT_SECRET           openssl rand -base64 32 (signs agents' tokens)
#   PUBLIC_URL             https://brandfactory.fly.dev
#   CORS_ALLOWED_ORIGINS   the web app's origin(s), comma-separated

app            = "brandfactory"
primary_region = "sin"
kill_signal    = "SIGTERM"

[build]
  dockerfile = "packages/core/Dockerfile"

# The core's own migrations (the registry, the roles and the wall) run before new machines take
# traffic. The first install needs a superuser and is done once by hand; the core refuses it as
# any other login (src/migrate.ts). Supabase's `postgres` is not one: there 0001 cannot take
# set_config and the other risky functions from the runtime role. A pack's migrations run with
# `core migrate <pack> <version>` once a version has passed its tests.
[deploy]
  release_command = "node_modules/.bin/tsx src/cli.ts migrate"

[http_service]
  internal_port        = 3001
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  # One machine: the guest rate limit, the events stream and the scheduler live in the process.
  min_machines_running = 1

[[http_service.checks]]
  method       = "GET"
  path         = "/health"
  interval     = "15s"
  grace_period = "10s"

[env]
  # DATABASE_PREPARE stays unset (off). `on` plans moves once per connection; the core refuses it
  # on the transaction pooler (6543), so DATABASE_URL needs the direct port or the session pooler
  # first.
  AUTH_PROVIDER    = "supabase"
  FILES_PROVIDER   = "supabase"
  CORE_ENVIRONMENT = "production"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
