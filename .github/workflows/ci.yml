name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight run when a new commit lands on the same ref (e.g. a
# force-push to a PR). `main` runs never collide because each push is a
# new ref revision.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · format · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so `cache: 'pnpm'` can locate the binary
      # and hash `pnpm-lock.yaml`. Version comes from the root
      # `package.json`'s `packageManager` field.
      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build the demo
        run: pnpm -F @brandfactory/web-next build
