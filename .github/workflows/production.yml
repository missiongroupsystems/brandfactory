name: Production

# The steps on production that need the database or Fly, run from GitHub so that no one's computer
# is needed: a cloud session starts this workflow and reads its log (docs/cloud-sessions.md).
#
#   check    read only: the server's health, the live pack version, and how each Instagram and
#            Facebook account is linked (read as the release person, through the server)
#   release  the pack: publish, test, migrate, promote `version`, then people's loadouts follow it
#   deploy   the server (`fly deploy`), then its health
#   agent-loadout  adds the moves `ops` names (space-separated) to every agent whose loadout holds
#            `inbox.meta_receive` (the webhook's principal, META_WEBHOOK_AS); prints a count only
#   meta     read only: the names of the server's secrets that Meta needs (never a value), and
#            the last hour of the server's log lines about Meta's webhooks (counts, no one's words)
#   meta-oembed  read only: one oEmbed call for a public Facebook post and one for a public
#            Instagram post, made on the server with the app token, so that Meta counts the
#            "Embed content" use case as tested; prints the HTTP status and the answer's keys
#   meta-test-calls  one pages_manage_engagement call that changes nothing (is_hidden=false on a
#            comment that is visible already) and one read_insights call, made on the server with
#            Casa Vostra's Page token; prints statuses, Meta's errors, the token's scopes, counts
#   meta-engagement  on Casa Vostra's test Page: a comment "Test" as the Page on its newest post,
#            is_hidden=false on it (no change), then the comment deleted; prints statuses only
#
# Secrets and variables are the repository's (Settings, Secrets and variables, Actions):
#   secrets    CORE_LOGIN_PASSWORD, CORE_MIGRATOR_PASSWORD (Keychain service brandbase-supabase-db),
#              RELEASE_PASSWORD (the sign-in of the person a promote acts for), FLY_API_TOKEN
#              (`fly tokens create deploy -a brandfactory`)
#   variables  RELEASE_EMAIL (that person's email), SUPABASE_ANON_KEY (the project's public key)

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        required: true
        type: choice
        options: [check, release, deploy, meta, meta-oembed, meta-test-calls, meta-engagement, agent-loadout, capture-brand]
      version:
        description: The pack version to release (release only), e.g. 1.16.0
        required: false
        type: string
      ops:
        description: The moves to add (agent-loadout only), space-separated
        required: false
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REF: qcxikcauwonrbftqiitp
      AUTH_PROVIDER: supabase
      CORE_ENVIRONMENT: production
      SUPABASE_URL: https://qcxikcauwonrbftqiitp.supabase.co
      SUPABASE_JWKS_URL: https://qcxikcauwonrbftqiitp.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_JWT_ISSUER: https://qcxikcauwonrbftqiitp.supabase.co/auth/v1
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The session pooler (IPv4), with Supabase's own root, as the CLI reaches it from anywhere.
      - name: Database logins
        if: inputs.task != 'deploy' && inputs.task != 'meta' && inputs.task != 'meta-oembed' && inputs.task != 'meta-test-calls' && inputs.task != 'meta-engagement'
        env:
          LOGIN_PW: ${{ secrets.CORE_LOGIN_PASSWORD }}
          MIGRATOR_PW: ${{ secrets.CORE_MIGRATOR_PASSWORD }}
        run: |
          url() {
            node -e 'const [u, p, r, ca] = process.argv.slice(1); process.stdout.write(`postgres://${u}.${r}:${encodeURIComponent(p)}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=verify-full&sslrootcert=${ca}`)' "$1" "$2" "$REF" "$GITHUB_WORKSPACE/packages/core/supabase-ca.crt"
          }
          login=$(url core_login "$LOGIN_PW")
          migrator=$(url core_migrator "$MIGRATOR_PW")
          echo "::add-mask::$login"
          echo "::add-mask::$migrator"
          echo "DATABASE_URL=$login" >> "$GITHUB_ENV"
          echo "MIGRATOR_DATABASE_URL=$migrator" >> "$GITHUB_ENV"

      # Read only. The accounts are read as the release person through the server, as the app reads
      # them: the database login cannot see them past the row rules.
      - name: Check
        if: inputs.task == 'check'
        working-directory: packages/core
        env:
          RELEASE_EMAIL: ${{ vars.RELEASE_EMAIL }}
          CORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          curl -fsS https://brandfactory.fly.dev/health && echo
          node -e '
          const { Client } = require("pg")
          const c = new Client({ connectionString: process.env.DATABASE_URL })
          ;(async () => {
            await c.connect()
            const live = await c.query("select version from packs.live_version($1, $2)", ["production", "brandbase"])
            console.log(`brandbase live in production: ${live.rows[0]?.version ?? "none"}`)
            await c.end()
          })().catch((e) => { console.error(e.message); process.exit(1) })'
          pnpm -s exec tsx src/cli.ts login "$RELEASE_EMAIL" >/dev/null
          unset CORE_PASSWORD
          node -e '
          const token = JSON.parse(require("fs").readFileSync(require("os").homedir() + "/.config/brandbase-core/session.json", "utf8")).token
          const call = async (op, input) => {
            const res = await fetch("https://brandfactory.fly.dev/ops/brandbase/" + op, {
              method: "POST",
              headers: { authorization: "Bearer " + token, "content-type": "application/json" },
              body: JSON.stringify(input),
            })
            if (!res.ok) throw new Error(op + " answered " + res.status)
            return res.json()
          }
          ;(async () => {
            const rows = []
            for (const b of await call("brand.list", {})) {
              const state = await call("brand.state", { brand: b.id })
              rows.push({ brand: b.id, instagram: state.instagram?.via ?? "none", facebook: state.facebook?.via ?? "none" })
            }
            console.table(rows)
          })().catch((e) => { console.error(e.message); process.exit(1) })'

      - name: Release
        if: inputs.task == 'release'
        working-directory: packages/core
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_EMAIL: ${{ vars.RELEASE_EMAIL }}
          CORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          manifest=$(node -p "require('../../packs/brandbase/manifest.json').version")
          [ "$VERSION" = "$manifest" ] || { echo "main has brandbase $manifest, not $VERSION"; exit 1; }
          core() { pnpm -s exec tsx src/cli.ts "$@"; }
          core login "$RELEASE_EMAIL"
          unset CORE_PASSWORD
          core publish ../../packs/brandbase
          core test brandbase "$VERSION"
          core migrate brandbase "$VERSION"
          pnpm -s exec tsx scripts/loadouts.ts before brandbase > "$RUNNER_TEMP/before.json"
          core promote brandbase "$VERSION"
          pnpm -s exec tsx scripts/loadouts.ts after brandbase "$RUNNER_TEMP/before.json"

      - name: Agent loadout
        if: inputs.task == 'agent-loadout'
        working-directory: packages/core
        env:
          OPS: ${{ inputs.ops }}
        run: |
          set -euo pipefail
          [ -n "$OPS" ] || { echo "name the moves to add in ops"; exit 1; }
          # shellcheck disable=SC2086
          pnpm -s exec tsx scripts/widen-agents.ts brandbase inbox.meta_receive $OPS

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: inputs.task == 'deploy' || inputs.task == 'meta' || inputs.task == 'meta-oembed' || inputs.task == 'meta-test-calls' || inputs.task == 'meta-engagement' || inputs.task == 'capture-brand'

      # Read only. `secrets list` shows names and digests, never values; the log lines name an
      # object and a count, or an account id, never a message.
      - name: Meta
        if: inputs.task == 'meta'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "Secrets the server holds (names only):"
          flyctl secrets list -a brandfactory --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const x of JSON.parse(s))console.log(" ", x.Name ?? x.name)})'
          echo "Meta lines in the server log:"
          flyctl logs -a brandfactory --no-tail 2>/dev/null | grep -i -E "meta webhook|meta:|meta reply" | tail -n 60 || echo "  none"

      # Read only. The app token is built inside the machine from its own secrets and goes only to
      # graph.facebook.com; the script prints a status and key names, or Meta's error, never the token.
      - name: Meta oEmbed
        if: inputs.task == 'meta-oembed'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep -oE "VERSION = 'v[0-9.]+'" packages/connect/src/brandbase/meta.ts | grep -oE 'v[0-9.]+')
          cat > "$RUNNER_TEMP/oembed.js" <<'JS'
          const graph = "https://graph.facebook.com/" + process.argv[1]
          const { META_APP_ID: id, META_APP_SECRET: secret } = process.env
          if (!id || !secret) { console.log("META_APP_ID or META_APP_SECRET is not set"); process.exit(1) }
          const calls = [
            ["oembed_post", "https://www.facebook.com/facebook/posts/10153231379946729"],
            ["instagram_oembed", "https://www.instagram.com/p/fA9uwTtkSN/"],
          ]
          ;(async () => {
            for (const [edge, url] of calls) {
              const q = new URLSearchParams({ url, access_token: id + "|" + secret })
              const res = await fetch(graph + "/" + edge + "?" + q)
              const body = await res.json().catch(() => ({}))
              const e = body.error
              console.log(edge, res.status, e ? JSON.stringify({ code: e.code, subcode: e.error_subcode, type: e.type, message: e.message }) : "keys: " + Object.keys(body).join(","))
            }
          })().catch((e) => { console.log("failed:", e.message); process.exit(1) })
          JS
          b64=$(sed 's/^          //' "$RUNNER_TEMP/oembed.js" | base64 -w0)
          echo "Graph $version, on the server:"
          flyctl ssh console -a brandfactory -C "node -e \"eval(Buffer.from('$b64','base64').toString())\" $version"

      # The Page token is opened inside the machine as the server opens it (account.meta_list as
      # META_WEBHOOK_AS, then openToken), and goes only to graph.facebook.com. The script prints
      # statuses, Meta's errors, the token's scopes and counts: never a token, a person or a text.
      - name: Meta test calls
        if: (inputs.task == 'meta-test-calls' || inputs.task == 'meta-engagement')
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Files on the server:"
          flyctl ssh console -a brandfactory -C "sh -c 'ls /app; ls /app/src/brandbase | head -50; ls /app/node_modules/@brandfactory/core/src | head -50'"
          cat > "$RUNNER_TEMP/mt.ts" <<'TS'
          import { createHmac } from 'node:crypto'
          import { loadEnv } from '/app/node_modules/@brandfactory/core/src/env.ts'
          import { openPostgres } from '/app/node_modules/@brandfactory/core/src/db.ts'
          import { call } from '/app/node_modules/@brandfactory/core/src/run.ts'
          import { GRAPH, metaApp } from '/app/src/brandbase/meta.ts'
          import { bound, PACK } from '/app/src/brandbase/accounts.ts'

          const e = process.env
          const out = (...a: unknown[]) => console.log(...a)
          const err = (b: any) => {
            const x = b?.error
            return x ? JSON.stringify({ code: x.code, subcode: x.error_subcode, type: x.type, message: x.message }) : ''
          }

          ;(async () => {
            for (const k of ['META_APP_ID', 'META_APP_SECRET', 'TOKEN_ENCRYPTION_KEY', 'META_WEBHOOK_AS', 'DATABASE_URL']) {
              if (!e[k]) { out(k, 'is not set'); process.exit(1) }
            }
            const env = loadEnv()
            const db = openPostgres(env.databaseUrl!, 1, { prepare: env.prepare })
            const deps = { db, auth: env.auth, environment: env.environment, now: () => new Date() } as any
            const rows = (await call(deps, {
              authorization: undefined, as: e.META_WEBHOOK_AS, internal: true, pack: PACK, op: 'account.meta_list', input: {},
            })) as { brand: string; platform: string; accountId: string; tokens: string }[]
            await db.close()
            const pages = rows.filter((r) => r.platform === 'facebook')
            out('Facebook Pages linked through our Meta app:', pages.length, 'brands:', pages.map((p) => p.brand).join(','))
            const page = pages.find((p) => /casa/i.test(p.brand)) ?? (pages.length === 1 ? pages[0] : undefined)
            if (!page) { out('no Facebook Page for Casa Vostra'); process.exit(1) }
            out('brand used:', page.brand)

            const app = metaApp({
              appId: e.META_APP_ID!, appSecret: e.META_APP_SECRET!, configId: e.META_CONFIG_ID ?? '',
              redirectUrl: e.META_REDIRECT_URL ?? 'https://x', masterKey: Buffer.from(e.TOKEN_ENCRYPTION_KEY!, 'base64'),
            })
            const token = app.openToken(page.tokens, bound('facebook', page.brand, page.accountId))
            const proof = (t: string) => createHmac('sha256', e.META_APP_SECRET!).update(t).digest('hex')
            async function g(method: 'GET' | 'POST' | 'DELETE', path: string, params: Record<string, string>, t = token) {
              const all = new URLSearchParams({ ...params, access_token: t, appsecret_proof: proof(t) })
              const signal = AbortSignal.timeout(60_000)
              const res = method === 'POST'
                ? await fetch(GRAPH + path, { method, body: all, signal })
                : await fetch(GRAPH + path + '?' + all, { method, signal })
              const body: any = await res.json().catch(() => ({}))
              return { status: res.status, body }
            }

            if (process.argv[2] === 'meta-engagement') {
              // A comment as the Page on its newest post, set visible (no change), then deleted.
              const latest = await g('GET', `/${page.accountId}/posts`, { limit: '1', fields: 'id' })
              const post = latest.body?.data?.[0]?.id
              out('GET newest post', latest.status, err(latest.body) || JSON.stringify({ found: !!post }))
              if (!post) process.exit(1)
              const made = await g('POST', `/${post}/comments`, { message: 'Test' })
              const id = made.body?.id
              out('POST comment', made.status, err(made.body) || JSON.stringify({ created: !!id }))
              if (!id) process.exit(1)
              const vis = await g('POST', `/${id}`, { is_hidden: 'false' })
              out('POST is_hidden=false', vis.status, err(vis.body) || JSON.stringify({ success: vis.body?.success === true }))
              const del = await g('DELETE', `/${id}`, {})
              out('DELETE comment', del.status, err(del.body) || JSON.stringify({ success: del.body?.success === true }))
              const after = await g('GET', `/${id}`, { fields: 'id' })
              out('GET comment after delete', after.status, err(after.body) || 'still there')
              out('comment deleted:', after.status !== 200)
              return
            }

            // The token's permissions.
            const dbg = await g('GET', '/debug_token', { input_token: token }, e.META_APP_ID + '|' + e.META_APP_SECRET)
            out('debug_token', dbg.status, err(dbg.body) || JSON.stringify({
              is_valid: dbg.body?.data?.is_valid, type: dbg.body?.data?.type, scopes: dbg.body?.data?.scopes,
            }))

            // 1. pages_manage_engagement: set is_hidden=false on a comment that is already visible.
            const posts = await g('GET', `/${page.accountId}/posts`, {
              limit: '5', fields: 'id,comments.limit(5){id,is_hidden,can_hide}',
            })
            const comments = ((posts.body?.data ?? []) as any[]).flatMap((p) => p.comments?.data ?? [])
            const visible = comments.filter((c) => c.is_hidden === false)
            out('GET posts', posts.status, err(posts.body) || JSON.stringify({
              posts: (posts.body?.data ?? []).length, comments: comments.length, visible: visible.length,
              can_hide: visible.filter((c) => c.can_hide === true).length,
            }))
            const pick = visible.find((c) => c.can_hide === true) ?? visible[0]
            if (!pick) {
              out('pages_manage_engagement: no visible comment on the last 5 posts; nothing sent')
            } else {
              const r = await g('POST', `/${pick.id}`, { is_hidden: 'false' })
              out('POST comment is_hidden=false', r.status, err(r.body) || JSON.stringify({ success: r.body?.success === true, can_hide: pick.can_hide === true }))
            }

            // 2. read_insights.
            for (const metric of ['page_impressions_unique', 'page_total_media_view_unique', 'page_follows']) {
              const r = await g('GET', `/${page.accountId}/insights`, { metric, period: 'day' })
              out('GET insights', metric, r.status, err(r.body) || JSON.stringify({ series: (r.body?.data ?? []).length }))
              if (r.status === 200) break
              if (r.body?.error?.code !== 100) break
            }
          })().catch((x) => { out('failed:', (x as Error).message); process.exit(1) })
          TS
          b64=$(base64 -w0 "$RUNNER_TEMP/mt.ts")
          flyctl ssh console -a brandfactory -C "sh -c 'echo $b64 | base64 -d > /tmp/mt.mts && cd /app && node_modules/.bin/tsx /tmp/mt.mts ${{ inputs.task }}; rm -f /tmp/mt.mts'"

      # Sets the capture brand (not a secret: a brand id). Fly restarts the server with it.
      - name: Capture brand
        if: inputs.task == 'capture-brand'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BRAND: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$BRAND" =~ ^[a-z0-9-]{1,80}$ ]] || { echo "give the brand id in version"; exit 1; }
          flyctl secrets set -a brandfactory "META_CAPTURE_BRAND=$BRAND"
          for i in $(seq 1 20); do curl -fsS https://brandfactory.fly.dev/health && echo && break; sleep 6; done
          curl -fsS https://brandfactory.fly.dev/capture && echo

      - name: Deploy
        if: inputs.task == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only -a brandfactory
          for i in $(seq 1 20); do curl -fsS https://brandfactory.fly.dev/health && echo && exit 0; sleep 6; done
          echo "the server did not answer /health"; exit 1
